<html>
    <head>
        <title>ARRAY</title>
    </head>

    <body>
        <h3>ARRAY :</h3>
        <p id ="demo"></p>
        <p id ="demo1"></p>
        <p id ="demo2"></p>

        <script>
            var veg = ["Potato", "Tomato", "Cucumber", "Carrot"]
            var demo = veg.join("  |  ");
            document.getElementById("demo").innerHTML = demo;

            var demo1 = veg.pop();
            document.getElementById("demo1").innerHTML = demo1;

            document.getElementById("demo2").innerHTML = veg[2];
        </script>
    </body>
</html>
