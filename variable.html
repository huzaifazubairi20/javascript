<!DOCTYPE html>

<html>
    <h1>JavaScript Variables</h1>
    <h3>Sum Of Two Numbers</h3>
    <p id="result"></p>

    <script>
        var num1 = 6;
        var num2 = 9;

        var sum = num1 + num2;
        document.getElementById("result").innerHTML = "The sum of given numbers is: " + sum;
    </script>
</html>
