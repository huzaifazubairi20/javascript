<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Phone Contact</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    body { background-color: #cbcbf5; }
    h1   { color: #a82211; }
    .card-label { font-size: 11px; color: #999; text-transform: uppercase; }
    pre  { font-size: 13px; color: #333; }
  </style>
</head>
<body class="py-4">

  <div class="container">

    <h1 class="mb-1">My Phone Contact</h1>
    <p class="text-muted mb-4">
      
    </p>

    <!-- Contact Card -->
    <div class="card shadow-sm mb-3" style="max-width:400px;">
      <div class="card-body">
        <h5 class="card-title" style="color:#28f321;">Contact Details</h5>
        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            <span class="card-label d-block">Name</span>
            <strong id="name">—</strong>
          </li>
          <li class="list-group-item">
            <span class="card-label d-block">Class</span>
            <strong id="class">—</strong>
          </li>
          <li class="list-group-item">
            <span class="card-label d-block">ID </span>
            <strong id="id">—</strong>
          </li>
          <li class="list-group-item">
            <span class="card-label d-block">Contact</span>
            <strong id="contact">—</strong>
          </li>
        </ul>
      </div>
    </div>

  </div>

  <script>

    // Create the contact object
    var myContact = {
      name:   "Huzaifa Zubairi",
      class:  "11th Class",
      id: "354547",
      contact:   "huzaifa@example.com"
    };

    // Dot notation
    var nameEl  = document.getElementById("name");
    var classEl = document.getElementById("class");
    nameEl.textContent  = myContact.name;
    classEl.textContent = myContact.class;

    // Bracket notation
    var idEl = document.getElementById("id");
    var contactEl = document.getElementById("contact");
    idEl.textContent = myContact["id"];
    contactEl.textContent = myContact["contact"];

    var codeEl = document.getElementById("codeDisplay");
    codeEl.textContent =
      'var myContact = {\n' +
      '  name:   "' + myContact.name + '",\n' +
      '  class:  "' + myContact.class + '",\n' +
      '  id: "' + myContact["id"] + '",\n' +
      '  contact   :   "' + myContact["contact"] + '"\n' +
      '};';

  </script>

</body>
</html>
