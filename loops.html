<!DOCTYPE html>
<html>
    <head>
        <title>LOOPS</title>
    </head>

    <body>
        
        <div id="demo"></div>
        
        <script>
            var fruits = ["Banana", "Orange", "Apple", "Mango"];
            var text = "";
            var i; 
            
            for (i = 0; i < fruits.length; i++) {
                text += fruits[i] + "<br>";
            }
            document.getElementById("demo").innerHTML = text;
        </script>
    </body>
</html>
