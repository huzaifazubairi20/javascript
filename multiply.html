<!DOCTYPE html>
<html>
    <head>
        <title>MULTIPLY</title>
    </head>

    <body>
        <button onclick="multiply(53)">Execute Function</button>

        <script>
            function multiply(a, b) {
                if (b === undefined) {
                    b = 1;
                }
                document.write(a * b);

            }
            
        </script>
    </body>
</html>
