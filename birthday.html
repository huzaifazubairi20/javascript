
<!DOCTYPE html>
<html>
<head>
    <title>My Birthday Countdown</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        .box {
            width: 500px;
            background-color: white;
            margin: 50px auto;
            padding: 20px;
            border: 3px solid blue;
            border-radius: 10px;
        }

        h1 {
            color: blue;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background-color: darkblue;
        }

        #timer {
            font-size: 23px;
            color: red;
            margin-top: 12px;
        }

    </style>
</head>

<body>

    <div class="box">
        <h1>My Birthday Countdown</h1>

        <p>My name is Huzaifa Zubairi.</p>
        <p>My birthday is on 15 April.</p>

        <button onclick="showCountdown()">
            Show Birthday Countdown
        </button>

        <br>

        <div id="timer"></div>
    </div>


    <script>

        function showCountdown() {

            let today = new Date();

            let year = today.getFullYear();

            let birthday = new Date(year, 3, 15);

            if (birthday < today) {
                birthday = new Date(year + 1, 3, 15);
            }

            let difference = birthday - today;

            let days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            let hours = Math.floor(
                (difference / (1000 * 60 * 60)) % 24
            );

            let minutes = Math.floor(
                (difference / (1000 * 60)) % 60
            );

            let seconds = Math.floor(
                (difference / 1000) % 60
            );

            document.getElementById("timer").innerHTML =
                days + " Days " + hours + " Hours " + minutes + " Minutes " + seconds + " Seconds";
        }

    </script>

</body>
</html>
