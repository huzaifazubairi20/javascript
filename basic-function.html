<!DOCTYPE html>
<html>
    <head>
        <title>Basic Function</title>
    </head>

    <body>
        <button onclick="myfunction(253)">Execute Function</button>

        <script>
            function myfunction(a, b) {
                if (b === undefined) {
                    b = 100;
                }
                document.write(a * b);

            }
            
        </script>
    </body>
</html>
