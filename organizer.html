    <!DOCTYPE html>
<html>
<head>
  <title>My Playlist Sorter</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <style>
    body { background: rgb(205, 98, 247); }
    h1, h3 { color: rgb(48, 10, 119); }
    .box { background: white; color: rgb(67, 5, 92); }
  </style>
</head>
<body>
<div class="container py-4">

  <h1 class="mb-1">My Playlist Sorter</h1>
  <p class="text-muted mb-4">Sort and label your daily tasks!</p>

  <!-- TOPIC 1 & 2: sort() and reverse() -->
  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">Task Names</h3>
      <button class="btn btn-primary mr-2" onclick="sortAZ()">Sort A to Z</button>
      <button class="btn btn-primary" onclick="sortZA()">Sort Z to A</button>
      <div id="nameResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

  <!-- TOPIC 3: sort() with compare function -->
  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">Task Priorities</h3>
      <button class="btn btn-primary mr-2" onclick="sortLeast()">Lowest Priority First</button>
      <button class="btn btn-primary" onclick="sortMost()">Highest Priority First</button>
      <div id="countResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

  <!-- TOPIC 4: map() -->
  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">Label Every Task Priority</h3>
      <button class="btn btn-primary" onclick="addLabel()">Add Priority Label</button>
      <div id="labelResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

</div>

<script>
    var tasks = ["Buy groceries", "Walk the dog", "Finish report", "Call mom", "Watch movie"];
    var priorities = [3, 1, 4, 2, 5];

    document.getElementById("nameResult").innerHTML = "Tasks : " + tasks;
    document.getElementById("countResult").innerHTML = "Priorities : " + priorities;

    function sortAZ() {
        tasks.sort();
        document.getElementById("nameResult").innerHTML = " A - Z : " + tasks;
    }

    function sortZA() {
        tasks.sort();
        tasks.reverse();
        document.getElementById("nameResult").innerHTML = " Z - A : " + tasks;
    }

    function sortLeast() { 
      priorities.sort(function(a,b){return a-b;}); 
      document.getElementById("countResult").innerHTML = "Least priority first : " + priorities; }

    function sortMost()  { 
      priorities.sort(function(a,b){return b-a;}); 
      document.getElementById("countResult").innerHTML = "Highest priority first : " + priorities; }

    function addLabel()  { 
      var l = priorities.map(function(c){return c+ "th priority";}); 
      document.getElementById("labelResult").innerHTML = "Labelled : " + l; }

</script>
</body>
</html>
