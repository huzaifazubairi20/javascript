<html>
    <head>
        <title>CARS</title>
    </head>
    <body>
        <h1>CARS</h1>
        <h2>My favorite cars are mentioned below :</h2>
        <u>
        <ol>
            <li id="car1"></li>
            <li id="car2"></li>
            <li id="car3"></li>
            <li id="car4"></li>
        </ol>
        </u>

        <br>

        <div id="demo"></div>
        <p>From the above list, my most favorite car is <b><span id="favorite1"></span></b></p>
        <p>From the above list, my least favorite car is <b><span id="least1"></span></b></p>

        <script>

            var myCars = {
                car1: "Audi",
                car2: "BMW",
                car3: "Mercedes",
                car4: "Lamborghini",
            };

            var car1E1 = document.getElementById("car1");
            var car2E1 = document.getElementById("car2");
            var car3E1 = document.getElementById("car3");
            var car4E1 = document.getElementById("car4");

            car1E1.textContent = myCars.car1;
            car2E1.textContent = myCars.car2;
            car3E1.textContent = myCars.car3;
            car4E1.textContent = myCars.car4;

            var cars = ["Audi", "BMW", "Mercedes", "Lamborghini"];  
            var demo = cars.join("  |  ");
            document.getElementById("demo").innerHTML = demo;

            var favorite1 = cars[0];
            document.getElementById("favorite1").innerHTML = favorite1;

            var least1 = cars[cars.length - 1];
            document.getElementById("least1").innerHTML = least1;




        </script>
    </body>
</html>
