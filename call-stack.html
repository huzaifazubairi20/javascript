<html>
    <head>
        <title>CALL STACK</title>
    </head>

    <body>
        <h3>CALL STACK :</h3>
        <p id ="demo"></p>

        <script>
            function add(a, b) {
                return a + b;
            }

            function average(a, b) {
                return add(a, b) / 2;
            }

            let result = average(34, 65);
            document.getElementById("demo").innerHTML = result;
        </script>
    </body>
</html>
