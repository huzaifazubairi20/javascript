<!DOCTYPE html>
<html>
    <head>
        <title>METHODS</title>
    </head>
    <body>
        <p>Basic Methods In JS</p>

        <script>
            var str = "HuzAifA zuBaiRi";

            document.write(str.toUpperCase());
            document.write("<br>");
            document.write(str.toLowerCase());
            document.write("<br>");
            document.write(str.startsWith('z'));
            document.write("<br>");

            var str1 = "I learnt basic methods in JS today";
            var patt = new RegExp("basic");
            var res = patt.test(str1);
            document.write(res);
            
        </script>
    </body>
</html>
